<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Web</title>

<style>
body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#111,#222,#000);
    font-family:Arial,sans-serif;
    color:white;
    text-align:center;
}
.box{
    width:90%;
    max-width:500px;
    padding:35px 20px;
    border-radius:25px;
    background:rgba(255,255,255,0.08);
    box-shadow:0 0 30px rgba(255,255,255,0.15);
}
h1{
    font-size:38px;
    margin-bottom:10px;
}
p{
    font-size:18px;
    color:#ddd;
}
button{
    margin-top:20px;
    padding:14px 30px;
    border:none;
    border-radius:30px;
    background:#fff;
    color:#111;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}
button:hover{
    transform:scale(1.05);
}
</style>
</head>

<body>

<div class="box">
    <h1>Welcome ❤️</h1>
    <p>My Web</p>
    <p>This is my personal webpage.</p>
    <button onclick="alert('Welcome to my website! ❤️')">
        Click Here
    </button>
</div>

</body>
</html>
